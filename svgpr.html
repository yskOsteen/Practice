<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Practice</title>

    <link rel="stylesheet" href="svg.css">
</head>
<body>
<section>
  

<svg width="100vw" height="100vh" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" style="position:fixed; top:0; left:0; z-index:-1;">
  <defs>
    <linearGradient id="foldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020A08" />
      <stop offset="0.5" stop-color="#1F8F6F" />
      <stop offset="1" stop-color="#020A08" />
    </linearGradient>

    <filter id="fabricWarp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.01 0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" />
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#020A08" />

  <path 
    d="M 300,0 
    C 350,150 250,300 320,450
    C 370,600 270,750 340,900
    L 410,900 
    C 330,300 430,150 380,0
    C 
    Z" 
    fill="url(#foldGradient)" 
    filter="url(#fabricWarp)"
  />

  <path 
    d="M 350,0 
   C 400,150 300,300 370,450 
   C 420,600 320,750 380,900 
   L 460,900 
   C 400,750 500,600 450,450 
   C 500,300 400,150 440,0 
   Z"
    fill="url(#foldGradient)" 
    filter="url(#fabricWarp)"
  />
</svg>


</section>

</body>
</html>
